[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pytimestretch"
dynamic = ["version"]
description = "NumPy bindings for Rubber Band, Signalsmith, PaulStretch, and Bungee Basic"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = [
    "LICENSE",
    "NOTICE",
    "licenses/nanobind-LICENSE",
    "extern/signalsmith-stretch/LICENSE.txt",
    "extern/signalsmith-linear/LICENSE.txt",
    "extern/libpaulstretch/COPYING",
    "extern/libpaulstretch/vendor/kissfft/COPYING_kiss_fft.txt",
    "extern/rubberband/src/ext/kissfft/COPYING",
    "extern/rubberband/src/ext/speex/COPYING",
    "extern/bungee/LICENSE",
    "extern/bungee/submodules/eigen/COPYING.MPL2",
    "extern/bungee/submodules/eigen/COPYING.README",
    "extern/bungee/submodules/eigen/COPYING.BSD",
    "licenses/pffft-LICENSE",
]
# The source repository is public; PyPI publication is not yet approved.
classifiers = ["Private :: Do Not Upload"]
maintainers = [{ name = "OpenMIRLab", email = "bernie40916@gmail.com" }]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/openmirlab/pytimestretch"

[tool.scikit-build]
wheel.packages = ["src/pytimestretch"]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/pytimestretch/__about__.py"

[tool.scikit-build.sdist]
# Vendored submodule sources must be included for the sdist->wheel path.
# Drop upstream subtrees this build never touches (docs, packaging glue for
# other host plugins, the nested cmd/util submodule) to keep the sdist lean.
exclude = [
    "docs/blueprints/**",
    "extern/rubberband/otherbuilds/**",
    "extern/rubberband/vamp/**",
    "extern/rubberband/ladspa-lv2/**",
    "extern/rubberband/dotnet/**",
    "extern/rubberband/cross/**",
    "extern/rubberband/com/**",
    "extern/signalsmith-stretch/cmd/**",
    "extern/signalsmith-stretch/web/**",
    "extern/signalsmith-linear/tests/**",
    "extern/libpaulstretch/.github/**",
    "extern/libpaulstretch/examples/**",
    "extern/libpaulstretch/npm/**",
    "extern/libpaulstretch/scripts/**",
    "extern/libpaulstretch/tests/**",
    "extern/libpaulstretch/vendor/dr_libs/**",
    "extern/bungee/cmd/**",
    "extern/bungee/submodules/cxxopts/**",
    "extern/bungee/submodules/eigen/bench/**",
    "extern/bungee/submodules/eigen/blas/**",
    "extern/bungee/submodules/eigen/ci/**",
    "extern/bungee/submodules/eigen/cmake/**",
    "extern/bungee/submodules/eigen/debug/**",
    "extern/bungee/submodules/eigen/demos/**",
    "extern/bungee/submodules/eigen/doc/**",
    "extern/bungee/submodules/eigen/failtest/**",
    "extern/bungee/submodules/eigen/lapack/**",
    "extern/bungee/submodules/eigen/scripts/**",
    "extern/bungee/submodules/eigen/test/**",
    "extern/bungee/submodules/eigen/unsupported/**",
    "extern/bungee/submodules/pffft/test_pffft.c",
    "extern/**/.git",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared CI runners (including Rosetta) cannot guarantee a speedup ratio.
# Keep measured performance thresholds opt-in on a controlled host.
addopts = "-m 'not performance'"
markers = ["performance: host-dependent speed comparisons; opt in with -m performance"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["extern"]

[tool.cibuildwheel]
# The `wheels.yml` workflow (pull_request/push/workflow_dispatch, always runs)
# only builds the Linux selector below -- manylinux x86_64, CPython
# 3.10-3.13 per requires-python (skip musllinux, PyPy, and i686; no known
# need yet, and each adds its own build/test cost). The
# macOS/Windows selectors in [tool.cibuildwheel.macos]/[.windows] below are
# only exercised by the opt-in `wheels-all-platforms.yml` workflow (the
# "all-platforms" PR label, or manual dispatch) -- they don't change what
# wheels.yml builds.
build = "cp3{10,11,12,13}-manylinux_x86_64"
skip = ["*-musllinux*", "pp*", "*-manylinux_i686"]
build-verbosity = 1
test-requires = ["pytest"]
# The engine_info() print runs before pytest so each wheel's engine/FFT
# choice (e.g. macOS vdsp/accelerate vs. Linux/Windows builtin) lands in
# the CI log even on a fully green run, not just on failure.
test-command = "python -c \"import json, pytimestretch._rubberband as rb, pytimestretch._signalsmith as ss, pytimestretch._paulstretch as ps, pytimestretch._bungee as bg; print('engine_info rubberband', json.dumps(rb.engine_info())); print('engine_info signalsmith', json.dumps(ss.engine_info())); print('engine_info paulstretch', json.dumps(ps.engine_info())); print('engine_info bungee', json.dumps(bg.engine_info()))\" && pytest {project}/tests -q"

[tool.cibuildwheel.macos]
# macOS runner is Apple Silicon (macos-14); build both arm64 and x86_64 as
# separate wheels (not universal2 -- keeps each wheel's engine_info() FFT
# choice traceable to one arch). cibuildwheel tests the x86_64 wheel under
# Rosetta 2 automatically on an arm64 runner; arm64 tests run natively.
build = "cp3{10,11,12,13}-macosx_*"
archs = ["arm64", "x86_64"]

# nanobind's own internals use C++17 aligned new/delete
# (operator new(size, align_val_t)), which AppleClang only makes available
# starting at macOS 10.13 -- the x86_64 CPython build's own default of
# 10.9 (observed: `-mmacosx-version-min=10.9` in a CI build log) is too
# low and fails with "aligned deallocation function ... is only available
# on macOS 10.13 or newer". 11.0 for arm64 matches Apple Silicon's actual
# floor (no arm64 Mac has ever shipped an OS below 11) and is comfortably
# above the C++17/nanobind requirement too.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
build = "cp3{10,11,12,13}-win_amd64"
archs = ["AMD64"]
